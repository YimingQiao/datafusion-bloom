[package]
name = "datafusion-bloom"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "Bloom transfer extension for Apache DataFusion"
license = "MIT"
readme = "README.md"
repository = "https://github.com/YimingQiao/datafusion-bloom"
keywords = ["arrow", "datafusion", "join", "query-optimizer"]
categories = ["database"]

[dependencies]
async-trait = "0.1"
datafusion = { version = "55.0.0", default-features = false, features = ["sql", "parquet", "unicode_expressions"] }
datafusion-datasource = "55.0.0"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[[bench]]
name = "synthetic"
harness = false

[[bench]]
name = "workload"
harness = false

[[bench]]
name = "handoff"
harness = false

[lints.rust]
unsafe_code = "forbid"
